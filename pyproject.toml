[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "1.0.0"
description = "ForgeAI – The Agent That Builds Agents"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "numpy>=1.26.0",
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forgeai*"]
